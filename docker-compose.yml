version: "3.7"

services:
  hermes_agent:
    image: nousresearch/hermes-agent:v2026.8.19
    tty: true
    stdin_open: true
    volumes:
      - hermes_agent_data:/opt/data
    networks:
      - network_public
    environment:
      - TZ=America/Sao_Paulo
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${DASHBOARD_PASS}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${DASHBOARD_SECRET}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=${API_SERVER_KEY}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
    command: ["gateway", "run"]
    deploy:
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.http.routers.hermes_dashboard.rule=Host(`hermes.autofunil.com.br`)
        - traefik.http.routers.hermes_dashboard.entrypoints=websecure
        - traefik.http.routers.hermes_dashboard.tls.certresolver=letsencryptresolver
        - traefik.http.services.hermes_dashboard.loadbalancer.server.port=9119
        - traefik.http.routers.hermes_api.rule=Host(`hermes-api.autofunil.com.br`)
        - traefik.http.routers.hermes_api.entrypoints=websecure
        - traefik.http.routers.hermes_api.tls.certresolver=letsencryptresolver
        - traefik.http.services.hermes_api.loadbalancer.server.port=8642

volumes:
  hermes_agent_data:
    external: true
    name: hermes_agent_data

networks:
  network_public:
    external: true
    name: network_public
