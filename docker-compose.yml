version: "3.8"

services:
  hermes_agent:
    image: nousresearch/hermes-agent:v2026.8.19
    tty: true
    stdin_open: true
    volumes:
      - hermes_data:/opt/data
    networks:
      - network_public
    environment:
      TZ: America/Sao_Paulo
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Defina OPENAI_API_KEY no Portainer}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 0.0.0.0
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${DASHBOARD_USERNAME:?Defina DASHBOARD_USERNAME no Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${DASHBOARD_PASS:?Defina DASHBOARD_PASS no Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${DASHBOARD_SECRET:?Defina DASHBOARD_SECRET no Portainer}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${API_SERVER_KEY:?Defina API_SERVER_KEY no Portainer}
      API_SERVER_CORS_ORIGINS: ${API_SERVER_CORS_ORIGINS:-}
    command: ["gateway", "run"]
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 5
        window: 120s
      update_config:
        order: start-first
        failure_action: rollback
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.hermes-dashboard.rule=Host(`${DOMAIN_DASHBOARD:?Defina DOMAIN_DASHBOARD no Portainer}`)
        - traefik.http.routers.hermes-dashboard.entrypoints=websecure
        - traefik.http.routers.hermes-dashboard.tls.certresolver=letsencryptresolver
        - traefik.http.routers.hermes-dashboard.service=hermes-dashboard
        - traefik.http.services.hermes-dashboard.loadbalancer.server.port=9119
        - traefik.http.routers.hermes-api.rule=Host(`${DOMAIN_API:?Defina DOMAIN_API no Portainer}`)
        - traefik.http.routers.hermes-api.entrypoints=websecure
        - traefik.http.routers.hermes-api.tls.certresolver=letsencryptresolver
        - traefik.http.routers.hermes-api.service=hermes-api
        - traefik.http.services.hermes-api.loadbalancer.server.port=8642
        - traefik.http.middlewares.hermes-ratelimit.ratelimit.average=10
        - traefik.http.middlewares.hermes-ratelimit.ratelimit.burst=20
        - traefik.http.routers.hermes-dashboard.middlewares=hermes-ratelimit
        - traefik.http.routers.hermes-api.middlewares=hermes-ratelimit

volumes:
  hermes_data:
    name: hermes_data

networks:
  network_public:
    external: true
    name: network_public
